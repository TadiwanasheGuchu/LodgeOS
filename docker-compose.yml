# Local development stack. Not a production deployment definition.
name: lodgeos

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-postgres-dev-only}
      LODGEOS_OWNER_PASSWORD: ${LODGEOS_OWNER_PASSWORD:-owner-dev-only}
      LODGEOS_APP_PASSWORD: ${LODGEOS_APP_PASSWORD:-app-dev-only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lodgeos"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      LODGEOS_DATABASE_URL: postgresql+asyncpg://lodgeos_app:${LODGEOS_APP_PASSWORD:-app-dev-only}@postgres:5432/lodgeos
      LODGEOS_MIGRATION_DATABASE_URL: postgresql+asyncpg://lodgeos_owner:${LODGEOS_OWNER_PASSWORD:-owner-dev-only}@postgres:5432/lodgeos
      LODGEOS_REDIS_URL: redis://redis:6379/0
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Delivers queued emails (ADR-0011). Uses the mock provider unless LODGEOS_EMAIL_PROVIDER=smtp.
  worker:
    build: ./backend
    command: ["python", "-m", "app.cli", "deliver-notifications"]
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      LODGEOS_DATABASE_URL: postgresql+asyncpg://lodgeos_app:${LODGEOS_APP_PASSWORD:-app-dev-only}@postgres:5432/lodgeos
      LODGEOS_REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
