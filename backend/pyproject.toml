[project]
name = "lodgeos-api"
version = "0.1.0"
description = "LodgeOS hospitality management API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.163,<0.200",
    "uvicorn[standard]>=0.54",
    "sqlalchemy[asyncio]>=2.1,<2.2",
    "asyncpg>=0.32",
    "alembic>=1.20",
    "pydantic>=2.14",
    "pydantic-settings>=2.16",
    "email-validator>=2.2",
    "argon2-cffi>=25.1",
    "redis>=8.1",
    "structlog>=26.1",
    "pillow>=12.0",
    "boto3>=1.40",
]

[dependency-groups]
dev = [
    "pytest>=9.2",
    "pytest-asyncio>=1.5",
    "httpx>=0.28",
    "ruff>=0.17",
    "mypy>=2.4",
    "moto[server]>=5.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]
"migrations/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["migrations/"]

[[tool.mypy.overrides]]
# boto3 ships without type information; its use is confined to the S3 adapter.
module = ["boto3", "botocore.*"]
ignore_missing_imports = true
